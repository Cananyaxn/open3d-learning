# 道路3D化 設定ファイル
# python main.py -c config_3d.yaml で実行

# ── 入力ファイル ──────────────────────────────────
road: data/processed/road1.geojson   # フィルタ済みの道路 GeoJSON
dem:  data/raw/experiment1_before_DEM.tif                             # GeoTIFF DEM ファイル
dem_crs: EPSG:6676   # DEMにCRS情報が埋め込まれていない場合に指定。省略時はEPSG:6668と仮定

# ── 出力 ──────────────────────────────────────────
output_ply: output/road_3d_1.ply   # メッシュファイル（MeshLab / CloudCompare でも開ける）

# ── 幅員設定 ──────────────────────────────────────
width_property: N13_006   # 幅員クラスが格納されている GeoJSON の属性名

# 各クラスの代表幅 (m)。変更したい値だけ上書きすればよい
# width_map:
#   1: 2.0    # 3m 未満
#   2: 4.0    # 3m 〜 5.5m 未満
#   3: 9.0    # 5.5m 〜 13m 未満
#   4: 16.0   # 13m 〜 19.5m 未満
#   5: 22.0   # 19.5m 以上
#   6: 2.0    # 不明（フォールバック）

# ── 表示オプション ────────────────────────────────
z_scale: 1.0
# 高さ方向の誇張倍率。平坦な地形で起伏を強調したいときは 2〜5 程度に増やす

color_by_height: true
# true  → 標高に応じて Jet カラーマップで着色（低=青, 中=緑, 高=赤）
# false → すべて白

# ── DEM nodata の扱い ─────────────────────────────
nodata_fill: 0.0
# DEM の範囲外や海域など、データのない領域に割り当てる標高値（メートル）